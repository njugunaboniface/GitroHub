<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#050508" />
<title>GitroHub — Connecting</title>
<style>
  :root { color-scheme: dark; --bg:#050508; --bg2:#0d0d14; --blue:#3b82f6; --cyan:#38bdf8; --green:#22c55e; --red:#ef4444; --text:#e6e8ee; --muted:#8b8fa3; --accent:var(--blue); --line:rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; min-height:100vh; min-height:100dvh; color:var(--text);
    background: radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 70%) fixed;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:15px; line-height:1.45; }
  canvas#bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .wrap { position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  .card { width:100%; max-width:420px; background:rgba(20,20,30,.62); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(59,130,246,.25); border-radius:20px; padding:18px 18px 16px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px var(--accent-glow, rgba(59,130,246,.14)); transition: box-shadow .8s ease; }
  .card.ok { --accent-glow: rgba(34,197,94,.16); border-color:rgba(34,197,94,.3); }
  .card.bad { --accent-glow: rgba(239,68,68,.16); border-color:rgba(239,68,68,.3); }
  .grid { display:block; }

  .progress-top { height:3px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; margin-bottom:14px; }
  .progress-top-fill { height:100%; width:0%; background:linear-gradient(90deg, var(--blue), var(--cyan)); transition:width .4s ease; }

  .hero { text-align:center; }
  .logo-wrap { position:relative; width:64px; height:64px; margin:0 auto 8px; }
  .logo-ring { position:absolute; inset:-6px; border-radius:50%; border:2px solid transparent; border-top-color:var(--accent); border-right-color:var(--accent); animation:spin 1.6s linear infinite; transition:border-color .6s ease, opacity .4s ease; }
  .logo-ring.done { animation:none; border-color:var(--accent); opacity:.35; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .logo-img { width:64px; height:64px; border-radius:50%; display:block; }
  h1 { font-size:18px; margin:2px 0 0; font-weight:700; }
  .subtitle { font-size:13px; color:var(--muted); margin:2px 0 10px; }

  .steps { text-align:left; background:rgba(0,0,0,.32); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-family:'SF Mono','Fira Code',Consolas,monospace; font-size:12.5px; line-height:1.8; }
  .log-line { display:flex; align-items:center; gap:8px; opacity:0; animation:lineIn .35s forwards; }
  @keyframes lineIn { to { opacity:1; } }
  .icon-wrap { width:15px; height:15px; flex:none; display:flex; align-items:center; justify-content:center; }
  .icon-spinner { width:12px; height:12px; border-radius:50%; border:2px solid rgba(59,130,246,.25); border-top-color:var(--blue); animation:spin .8s linear infinite; }
  .icon-check, .icon-x { width:14px; height:14px; }
  /* once finished, the five steps fold into one line (tap to open them again) */
  .steps.folded .log-line { display:none; }
  .steps .sum { display:none; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; width:100%; background:none; border:0; color:inherit; font:inherit; padding:0; text-align:left; }
  .steps.folded .sum { display:flex; }
  .steps.folded.open .log-line { display:flex; }
  .steps.folded.open .sum { margin-bottom:4px; }
  .steps .chev { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
  .steps .sum[aria-expanded="true"] .chev { transform:rotate(180deg); }
  @media (prefers-reduced-motion:reduce) { .steps .chev { transition:none; } }

  .result { margin-top:12px; padding:12px 14px; border-radius:12px; text-align:left; display:none; background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.28); }
  .result.show { display:flex; gap:12px; align-items:center; animation:pop .4s cubic-bezier(.34,1.56,.64,1); }
  .result.fail { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3); }
  @keyframes pop { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:scale(1); } }
  .result-icon-badge { width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.32); }
  .result-icon-badge.fail { background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.32); }
  .result-icon-badge svg { width:20px; height:20px; }
  .result-icon-badge path { stroke-dasharray:40; stroke-dashoffset:40; animation:draw .5s .1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .result-title { font-weight:700; font-size:14.5px; }
  .result-detail { font-size:13px; color:var(--muted); margin-top:1px; overflow-wrap:anywhere; }

  .after { display:none; margin-top:12px; text-align:center; }
  .after.show { display:block; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; padding:11px 16px; border-radius:13px; text-decoration:none; font-weight:700; font-size:15.5px; color:#06121f; background:linear-gradient(135deg, var(--blue), var(--cyan)); box-shadow:0 6px 20px rgba(59,130,246,.3); }
  .btn.fail { background:linear-gradient(135deg, #f87171, #ef4444); box-shadow:0 6px 20px rgba(239,68,68,.3); }
  .btn:focus-visible { outline:3px solid #7fb0ff; outline-offset:2px; }
  .redirect-label { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .footer { margin-top:12px; text-align:center; font-size:11px; color:rgba(139,143,163,.6); }

  @media (min-width:900px) {
    .wrap { padding:32px; }
    .card { max-width:880px; padding:36px 40px; border-radius:24px; }
    .progress-top { margin-bottom:26px; }
    .grid { display:grid; grid-template-columns:1fr 1.1fr; gap:48px; align-items:center; }
    .hero { text-align:left; }
    .logo-wrap { margin:0 0 14px; width:84px; height:84px; } .logo-img { width:84px; height:84px; }
    h1 { font-size:28px; } .subtitle { font-size:15px; margin-bottom:0; }
    .steps { font-size:13.5px; padding:14px 18px; }
    .footer { text-align:left; }
  }
  @media (max-height:600px) and (max-width:899px) { .logo-wrap, .logo-img { width:48px; height:48px; } .subtitle { margin-bottom:6px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="wrap">
    <main class="card" id="card">
      <div class="progress-top"><div class="progress-top-fill" id="progressFill"></div></div>
      <div class="grid">
        <section class="hero">
          <div class="logo-wrap"><div class="logo-ring" id="logoRing"></div><img class="logo-img" src="/logo.png" alt="GitroHub" /></div>
          <h1>GitroHub</h1>
          <div class="subtitle" id="subtitle">Linking your GitHub account…</div>
          <div class="footer">Powered by GitroHub</div>
        </section>
        <section class="detail" aria-live="polite">
          <div class="steps" id="terminal">
            <button class="sum" type="button" id="stepsSum" aria-expanded="false"><span id="stepsSumText">Steps</span><svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <div class="result" id="resultBox">
            <div class="result-icon-badge" id="resultIconBadge"></div>
            <div><div class="result-title" id="resultTitle"></div><div class="result-detail" id="resultDetail"></div></div>
          </div>
          <div class="after" id="after">
            <a href="#" class="btn" id="openTelegramBtn">Return to Telegram</a>
            <div class="redirect-label" id="redirectLabel"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

<script>
  // The server injects window.__GITROHUB__ (status, steps, username, error, botDeepLink for THIS deployment).
  // No hardcoded bot name: a wrong guess once sent people to the wrong bot. If the default is hit, '#' is a no-op.
  var DATA = window.__GITROHUB__ || { status: 'success', username: 'you', steps: [], botDeepLink: '#' };
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── light ambient background (skipped when the device asks for less motion) ──
  var canvas = document.getElementById('bg'), cx = canvas.getContext('2d'), w, h, confetti = [];
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  var particles = []; for (var i = 0; i < 26; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + .4, s: Math.random() * .3 + .05, a: Math.random() * .45 + .1 });
  function burst(x, y) {
    var colors = ['#22c55e', '#38bdf8', '#a78bfa', '#facc15'];
    for (var i = 0; i < 46; i++) { var ang = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 2; confetti.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.5, r: Math.random() * 2.5 + 1.5, c: colors[i % 4], a: 1, rot: Math.random() * 3, vr: (Math.random() - .5) * .3 }); }
  }
  function draw() {
    cx.clearRect(0, 0, w, h);
    for (var i = 0; i < particles.length; i++) { var p = particles[i]; p.y -= p.s; if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; } cx.beginPath(); cx.fillStyle = 'rgba(148,180,255,' + p.a + ')'; cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill(); }
    confetti = confetti.filter(function (c) { return c.a > 0; });
    confetti.forEach(function (c) { c.x += c.vx; c.y += c.vy; c.vy += .12; c.rot += c.vr; c.a -= .012; cx.save(); cx.translate(c.x, c.y); cx.rotate(c.rot); cx.globalAlpha = Math.max(0, c.a); cx.fillStyle = c.c; cx.fillRect(-c.r, -c.r * .4, c.r * 2, c.r * .8); cx.restore(); });
    cx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  if (!reduced) draw();

  var $ = function (id) { return document.getElementById(id); };
  var terminal = $('terminal'), card = $('card');
  var iconSpinner = '<span class="icon-spinner"></span>';
  var iconCheck = '<svg class="icon-check" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var iconX = '<svg class="icon-x" viewBox="0 0 24 24" fill="none"><path d="M5 5 19 19M19 5 5 19" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var heroCheck = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var heroX = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 5 19 19M19 5 5 19" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"/></svg>';
  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduced ? Math.min(ms, 30) : ms); }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function addLine(text) {
    var line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="icon-wrap">' + iconSpinner + '</span><span>' + esc(text) + '</span>';
    terminal.appendChild(line);
    return line;
  }
  function resolveLine(line, ok) { line.querySelector('.icon-wrap').innerHTML = ok ? iconCheck : iconX; }

  function fold(ok, doneCount, total) {
    $('stepsSumText').textContent = ok ? ('All ' + total + ' steps completed') : (doneCount + ' of ' + total + ' steps — stopped');
    terminal.classList.add('folded');
  }
  $('stepsSum').addEventListener('click', function () {
    var open = terminal.classList.toggle('open');
    $('stepsSum').setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  async function run() {
    var steps = DATA.steps || [];
    var failIndex = DATA.status === 'error' ? (DATA.failStepIndex != null ? DATA.failStepIndex : steps.length - 1) : -1;
    var done = 0;
    for (var i = 0; i < steps.length; i++) {
      var line = addLine(steps[i]);
      $('progressFill').style.width = Math.round(((i + 1) / steps.length) * (DATA.status === 'error' ? 60 : 100)) + '%';
      await wait(320);
      var failed = i === failIndex;
      resolveLine(line, !failed);
      if (!failed) done++;
      if (failed) break;
      await wait(120);
    }
    await wait(250);
    fold(DATA.status !== 'error', done, steps.length);
    if (DATA.status === 'success') success(); else failure();
  }

  function showAfter(label) {
    $('after').classList.add('show');
    $('openTelegramBtn').href = DATA.botDeepLink;
    $('redirectLabel').textContent = label;
  }
  function success() {
    $('logoRing').classList.add('done'); card.classList.add('ok');
    document.documentElement.style.setProperty('--accent', 'var(--green)');
    $('subtitle').textContent = 'Connection established';
    $('resultBox').classList.add('show');
    $('resultIconBadge').innerHTML = heroCheck;
    $('resultTitle').textContent = DATA.title || 'GitHub connected';
    $('resultDetail').textContent = DATA.detail || ('Linked as @' + DATA.username);
    $('progressFill').style.width = '100%';
    showAfter('Opening Telegram…');
    if (!reduced) burst(window.innerWidth / 2, window.innerHeight * .3);
    autoOpen(3);
  }
  function failure() {
    $('logoRing').classList.add('done'); card.classList.add('bad');
    document.documentElement.style.setProperty('--accent', 'var(--red)');
    $('subtitle').textContent = 'Connection failed';
    $('resultBox').classList.add('show', 'fail');
    $('resultIconBadge').classList.add('fail');
    $('resultIconBadge').innerHTML = heroX;
    $('resultTitle').textContent = 'Couldn’t connect';
    $('resultDetail').textContent = DATA.error || 'Something went wrong linking your account.';
    $('openTelegramBtn').classList.add('fail');
    showAfter('');
  }
  // Tries to hand you back to Telegram on its own; the button is always there if the browser blocks it.
  function autoOpen(seconds) {
    var left = seconds;
    var label = $('redirectLabel');
    label.textContent = 'Opening Telegram in ' + left + '…';
    var t = setInterval(function () {
      left -= 1;
      if (left <= 0) { clearInterval(t); label.textContent = 'If Telegram didn’t open, tap the button.'; window.location.href = DATA.botDeepLink; }
      else label.textContent = 'Opening Telegram in ' + left + '…';
    }, 1000);
  }
  run();
</script>
</body>
</html>
